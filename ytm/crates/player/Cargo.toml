[package]
name = "player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# libmpv2 is the maintained fork of the abandoned `libmpv` crate (adopted in the Phase 0 spike).
libmpv2 = "4"
libmpv2-sys = "4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "play"

# Jam for Android: mpv's Android audio output (AudioTrack) reaches Java through FFmpeg's JNI hook,
# which needs the process's JavaVM. The engine fills ndk-context at startup (android/mod.rs).
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
