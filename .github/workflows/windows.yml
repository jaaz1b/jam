# Builds Jam for Windows: the YouTube Music engine (ytm/, Rust + Tauri, based on Limusic) and the
# Jam desktop app (desktop/, castLabs Electron), packaged together as one installer + portable zip.
#
# Every push to main builds. The installer and zip are attached to a GitHub release named after the
# version (prerelease), and kept as workflow artifacts too.
#
# Optional repo secrets: LASTFM_API_KEY / LASTFM_API_SECRET (Last.fm scrobbling in YouTube Music;
# get a key at https://www.last.fm/api/account/create). Without them everything else works.

name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'ytm/src-tauri/gen/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # libmpv (the engine's audio player), pinned exactly as upstream Limusic pins it. See
  # ytm/ and upstream's windows-release.yml for why this exact build.
  MPV_DEV_URL: https://github.com/SimoHypers/limusic/releases/download/deps/libmpv-2-x86_64-20260610-git-304426c.7z
  MPV_DEV_SHA256: af708edcdf6ed12ac7b2bb31b4cbeba0bf7d4eef345a715ef5de782c0ddd6671
  MPV_DIR: ${{ github.workspace }}\.libmpv
  # castLabs Electron for Content Security (Widevine, for Spotify / Apple Music).
  ECS_URL: https://github.com/castlabs/electron-releases/releases/download/v45.2.1%2Bwvcus/electron-v45.2.1%2Bwvcus-win32-x64.zip
  ECS_SHA256: a17f87a95a62e8f336d6fa18e57b9bc83d513b02211e4e5771a45cfd7482740e

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ytm/ui/pnpm-lock.yaml

      # ---------------------------------------------------------------- YouTube Music engine (ytm/)

      - name: Engine UI (Svelte)
        shell: bash
        run: cd ytm/ui && pnpm install --frozen-lockfile && pnpm build

      - name: Rust (MSVC)
        shell: bash
        run: rustup default stable-msvc

      # Before rust-cache on purpose: RUSTFLAGS is part of the cache key (see upstream's notes).
      - name: RUSTFLAGS (libmpv link path + rust-lld)
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-L native=${{ github.workspace }}\.libmpv"
          SYSROOT="$(rustc --print sysroot | tr '\\' '/')"
          RUST_LLD="$SYSROOT/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if [ -f "$RUST_LLD" ]; then FLAGS="$FLAGS -C linker-flavor=lld-link -C linker=$RUST_LLD"; fi
          echo "RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ytm -> target

      - name: Tauri CLI
        shell: bash
        run: npm install -g "@tauri-apps/cli@2.11.5"

      - name: libmpv import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null
          curl.exe -fsSL -o "$env:MPV_DIR\mpv-dev.7z" "$env:MPV_DEV_URL"
          if ((Get-FileHash "$env:MPV_DIR\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_DEV_SHA256) { throw "mpv-dev.7z checksum mismatch" }
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null
          if (-not (Test-Path "$env:MPV_DIR\libmpv-2.dll")) { throw "libmpv-2.dll missing from the dev package" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Set-Location "$env:MPV_DIR"
          $names = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "parsed only $($names.Count) exports from libmpv-2.dll" }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          if (-not (Test-Path "$env:MPV_DIR\mpv.lib")) { throw "lib.exe did not produce mpv.lib" }
          Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\ytm\src-tauri\libmpv-2.dll" -Force

      # Snapshot of the community player-cipher registry, as upstream does. Never fatal: the engine
      # refreshes it at runtime anyway.
      - name: Player-cipher registry snapshot
        shell: bash
        run: |
          for url in https://raw.githubusercontent.com/MetrolistGroup/faraday/master/registry/player_configs.json \
                     https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json; do
            if curl -fsSL --max-time 30 "$url" -o /tmp/pc.json && jq -e '(.players | objects | length) > 0' /tmp/pc.json >/dev/null 2>&1; then
              cp /tmp/pc.json ytm/src-tauri/cipher_configs.json; echo "bundled from $url"; exit 0
            fi
          done
          echo "::warning::no player-cipher registry reachable; the engine fetches it at runtime"

      - name: Last.fm API keys (optional)
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > ytm/src-tauri/lastfm.keys
          else
            echo "::warning::LASTFM_API_KEY / LASTFM_API_SECRET not set: YouTube Music builds without Last.fm (ListenBrainz still works)"
          fi

      - name: Build the engine
        shell: bash
        run: |
          set -euo pipefail
          cd ytm
          tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
          ls -la target/release/*.exe

      - name: Stage the engine for Jam
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ytm-dist
          cp ytm/target/release/jam-ytm.exe ytm-dist/
          cp ytm/src-tauri/libmpv-2.dll ytm-dist/
          cp -r ytm/ui/build ytm-dist/ui
          cp LICENSE ytm-dist/LICENSE.txt
          ls -la ytm-dist

      # ---------------------------------------------------------------- Jam desktop app (desktop/)

      - name: castLabs Electron (Widevine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ".ecs" | Out-Null
          curl.exe -fsSL -o ".ecs\ecs.zip" "$env:ECS_URL"
          if ((Get-FileHash ".ecs\ecs.zip" -Algorithm SHA256).Hash -ne $env:ECS_SHA256) { throw "castLabs Electron checksum mismatch" }
          7z x ".ecs\ecs.zip" -o".ecs\win" -y | Out-Null
          if (-not (Test-Path ".ecs\win\electron.exe")) { throw "electron.exe missing from the castLabs zip" }

      - name: Build Jam
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          npm ci --ignore-scripts
          npx electron-builder --win --publish never
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jam-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish as a release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version desktop/package.json)"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" desktop/dist/*.exe desktop/dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Jam ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install Jam-Setup-*.exe, or unzip Jam-Portable-*.zip."
