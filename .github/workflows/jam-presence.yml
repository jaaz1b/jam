# Jam Presence: a small Android app that shows what Apple Music (or another player) is playing as
# your Discord status, with Jam's Discord sign-in and card settings (android/presence).
# Builds the APK, tests it on an emulator with a stand-in Apple Music, and publishes a prerelease
# presence-v1.0.<run> with the APK and the test's screenshots.
#
# Signing: the same as Jam for Android (secrets JAM_KEYSTORE_B64 etc., else android/keystore/jam-debug.jks).

name: Jam Presence

on:
  push:
    branches: [main, jam-presence]
    paths:
      - 'android/presence/**'
      - '.github/workflows/jam-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jam-presence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null

      - name: Signing key
        env:
          KS_B64: ${{ secrets.JAM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JAM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.JAM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JAM_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jam.jks"
            {
              echo "JAM_KEYSTORE_FILE=$RUNNER_TEMP/jam.jks"
              echo "JAM_KEYSTORE_PASSWORD=$KS_PASS"
              echo "JAM_KEY_ALIAS=$KS_ALIAS"
              echo "JAM_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cd android/presence
          for i in 1 2 3; do ./gradlew --version >/dev/null && break; sleep 20; done
          ./gradlew :app:assembleRelease :fakeplayer:assembleDebug --stacktrace \
            -PappVersionName="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk "../../out/Jam-Presence-${VERSION}.apk"
          cp fakeplayer/build/outputs/apk/debug/fakeplayer-debug.apk ../../out/test-player.apk
          ls -la ../../out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jam-presence
          path: out/*.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jam-presence
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: bash android/presence/ci/smoke.sh "$(ls out/Jam-Presence-*.apk | head -1)" out/test-player.apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jam-presence-test
          path: shots

  release:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jam-presence
          path: out

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jam-presence-test
          path: shots

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TEST: ${{ needs.test.result }}
        run: |
          TAG="presence-v${VERSION}"
          if [ -d shots ]; then (cd shots && zip -qr ../smoke-test.zip .); fi
          gh release create "$TAG" "out/Jam-Presence-${VERSION}.apk" $( [ -f smoke-test.zip ] && echo smoke-test.zip ) \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Jam Presence ${VERSION}" \
            --notes "Shows what you play in Apple Music (or another player you pick) as your Discord status. On your phone, download Jam-Presence-${VERSION}.apk and open it to install, then follow the Setup steps in the app. Emulator test: ${TEST}."
