<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Jam</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0f0f14; color:#ececf1; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { text-align:center; max-width:380px; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#9a9aab; margin:0 0 20px; }
  button { font:inherit; background:#8b5cf6; color:#fff; border:0; border-radius:8px; padding:10px 22px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .note { font-size:12px; margin-top:14px; color:#6c6c7c; }
  .alt { margin-top:26px; padding-top:18px; border-top:1px solid #23232c; }
  .alt p { margin:0 0 10px; font-size:13px; }
  .alts { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .alts button { background:#1d1d25; border:1px solid #2c2c37; display:flex; align-items:center; gap:8px; padding:8px 14px; }
  .alts button:hover { border-color:#4a4a58; filter:none; }
  .alts .dot { width:8px; height:8px; border-radius:50%; }
</style>
</head>
<body>
  <div class="box">
    <h1 id="title">Jam can't connect</h1>
    <p>The service may be down, or your internet connection dropped. Jam will retry automatically.</p>
    <button id="retry">Try again</button>
    <div class="note" id="note"></div>
    <div class="alt" id="alt" hidden>
      <p>Or keep listening somewhere else:</p>
      <div class="alts" id="alts"></div>
    </div>
  </div>
<script>
  const retry = () => window.octave.retry();
  document.getElementById('retry').onclick = retry;
  window.addEventListener('online', retry);
  const q = new URLSearchParams(location.search);
  const err = q.get('err');
  if (err) document.getElementById('note').textContent = err;
  if (q.get('name')) document.getElementById('title').textContent = `Can't reach ${q.get('name')}`;
  let others = [];
  try { others = JSON.parse(q.get('others') || '[]'); } catch {}
  if (others.length) {
    document.getElementById('alt').hidden = false;
    for (const o of others) {
      const b = document.createElement('button');
      const d = document.createElement('span'); d.className = 'dot'; d.style.background = o.color;
      b.append(d, document.createTextNode(o.name));
      b.onclick = () => window.octave.switchTo(o.id);
      document.getElementById('alts').appendChild(b);
    }
  }
  setInterval(() => { if (navigator.onLine) retry(); }, 30000);
</script>
</body>
</html>
